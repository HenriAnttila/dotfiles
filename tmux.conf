set -g prefix M-a
unbind C-b
unbind C-a
bind M-a send-prefix

# Essential Neovim fixes
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set -g extended-keys on
set -as terminal-features ',xterm-256color:extkeys'


# Allow escape passthrough for Neovim background sync
set -g allow-passthrough on

# Better scrollback
set -g history-limit 50000

bind c new-window -c "#{pane_current_path}"

# --- Pane navigation: Ctrl + h/j/k/l (no prefix) ---
# Handled by vim-tmux-navigator (loaded near the bottom): seamless between tmux
# panes and nvim splits. Nothing to bind here.

# --- Window navigation (no prefix) ---
# Alt+c -> new window (in current dir)
bind -n M-c new-window -c "#{pane_current_path}"
# Alt+n -> menu: pick what the new window should run (all in current dir).
# Press the letter shown next to an entry, or navigate with j/k and hit Enter.
# "npm >" opens a submenu; those windows `exec zsh` afterwards so the output of
# a finished install/build (or a Ctrl-C'd dev server) stays on screen.
# (No Shift: with extended-keys on, tmux sees Alt+Shift+c as M-S-c, not M-C.)
bind -n M-n display-menu -T "#[align=centre fg=#{@accent}]New window" -x C -y C \
  "lazygit"      g "new-window -c '#{pane_current_path}' -n lazygit lazygit" \
  "nvim"         e "new-window -c '#{pane_current_path}' -n nvim nvim" \
  "claude"       c "new-window -c '#{pane_current_path}' -n claude claude" \
  "npm >"        n "display-menu -T '#[align=centre fg=#{@accent}]npm' -x C -y C \
                      'npm install'   i \"new-window -c '#{pane_current_path}' -n npm   'npm install; exec zsh'\" \
                      'npm run dev'   d \"new-window -c '#{pane_current_path}' -n dev   'npm run dev; exec zsh'\" \
                      'npm run build' b \"new-window -c '#{pane_current_path}' -n build 'npm run build; exec zsh'\" \
                      '' \
                      'cancel'        q ''" \
  "" \
  "named shell"  s "command-prompt -p 'window name:' \"new-window -c '#{pane_current_path}' -n '%%'\"" \
  "" \
  "cancel"       q ""
# Alt+p -> fuzzy-pick an open PR and check out its branch, in a popup over the
# current pane. -d runs it in the pane's directory so gh targets the right repo.
# Searching PR titles beats lazygit's remote-branches list, which shows bare
# branch names with no PR number, title, or author.
# -EE (not -E) closes the popup only on success: a single -E closes on *any*
# exit, so a missing script or a gh error just flashes past unread.
bind -n M-p display-popup -EE -w 80% -h 70% -d "#{pane_current_path}" \
  "~/.tmux/scripts/pr-checkout.sh"
# Alt+o -> menu: pick what to run in a popup over the current pane. Same shape
# as Alt+n, but the choice opens in a popup instead of a new window.
bind -n M-o display-menu -T "#[align=centre fg=#{@accent}]Popup" -x C -y C \
  "lazygit"      g "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit" \
  "" \
  "cancel"       q ""
# Alt+h / Alt+l -> previous / next window
bind -n M-h previous-window
bind -n M-l next-window
# Alt+x -> kill current pane (with confirmation)
bind -n M-x confirm-before -p "kill pane? (y/n)" kill-pane
# Alt+1..9 -> jump to window N, creating it (in current dir) if it doesn't exist.
# Alt+0 -> window 10.
bind -n M-1 if-shell 'tmux select-window -t :1'  '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n M-2 if-shell 'tmux select-window -t :2'  '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n M-3 if-shell 'tmux select-window -t :3'  '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n M-4 if-shell 'tmux select-window -t :4'  '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n M-5 if-shell 'tmux select-window -t :5'  '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n M-6 if-shell 'tmux select-window -t :6'  '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n M-7 if-shell 'tmux select-window -t :7'  '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n M-8 if-shell 'tmux select-window -t :8'  '' 'new-window -t :8 -c "#{pane_current_path}"'
bind -n M-9 if-shell 'tmux select-window -t :9'  '' 'new-window -t :9 -c "#{pane_current_path}"'
bind -n M-0 if-shell 'tmux select-window -t :10' '' 'new-window -t :10 -c "#{pane_current_path}"'

# --- Session switching (no prefix, arrow-free) ---
# Alt+s -> session picker. mode-keys is vi, so navigate it with j/k (and /
# to filter); Enter selects. No arrow keys needed.
bind -n M-s choose-tree -Zs
# Alt+Shift+S -> new session, prefilled with the current directory's name
# (editable). Starts in the current pane's path, like new windows and splits.
# Bound as M-S-s, not M-S: with extended-keys on (line 11) tmux reports
# Alt+Shift+s as M-S-s. M-S is kept as a fallback for terminals that don't
# negotiate extended keys, where the same press arrives as plain M-S.
bind -n M-S-s command-prompt -I "#{b:pane_current_path}" -p "New session:" \
  "new-session -s '%%' -c '#{pane_current_path}'"
bind -n M-S command-prompt -I "#{b:pane_current_path}" -p "New session:" \
  "new-session -s '%%' -c '#{pane_current_path}'"
# Alt+§ -> rename current session. Replaces tmux's default prefix + $, which
# needs Shift+4. § is the top-left key on a Finnish layout, and Caps Lock is
# remapped to Right Option (the only Option that sends Alt, see ghostty/config
# macos-option-as-alt=right), so this stays a left-hand chord. prefix + $ is
# left bound as a fallback.
bind -n M-§ command-prompt -I "#S" "rename-session '%%'"
# Alt+k / Alt+j -> previous / next session. (Avoids Alt+h/l: on macOS the meta
# key can trigger global shortcuts like Cmd+H = Hide, Cmd+M = Minimize.)
bind -n M-k switch-client -p
bind -n M-j switch-client -n
# Last (most-recently-used) session lives on prefix + L (Alt+Tab is the macOS
# app switcher, so it can't be used here).

# Pane navigation is on Ctrl + hjkl (vim-tmux-navigator). Unbind default prefix + arrows.
unbind Up
unbind Down
unbind Left
unbind Right

# Rename current window (prefix r, or Alt+r with no prefix)
bind r command-prompt -I "#W" "rename-window '%%'"
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Reload this config in place (prefix + R)
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Renumber windows when one is closed
set -g renumber-windows on

# Vi mode for copy mode
setw -g mode-keys vi

# Better splits (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# --- Pane splits (no prefix, no shift) ---
# Alt+i -> split left/right (I looks like a vertical divider, panes side by side)
bind -n M-i split-window -h -c "#{pane_current_path}"
# Alt+- -> split top/bottom (- looks like a horizontal divider)
bind -n M-- split-window -v -c "#{pane_current_path}"
# Alt+v -> enter copy-mode (v = visual select; then V line-select, y to yank)
bind -n M-v copy-mode


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'imrellx/flexoki-tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux2k status bar (from 2KAbhishek/dots2k) — replaced by inline minimal theme below
# set -g @plugin '2kabhishek/tmux2k'
# set -g @tmux2k-right-plugins "cpu ram battery network time"
# set -g @tmux2k-icons-only "false"
# set -g @tmux2k-theme "duo"
# set -g @tmux2k-duo-bg "#000000"
# set -g @tmux2k-duo-fg "#1688f0"

set -g @plugin 'Ataraxy-Labs/opensessions'

# Smarter window names (program when running, else dir). Needs python3 + libtmux.
set -g @plugin 'ofirgall/tmux-window-name'

set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overrides after plugins load
set -g mode-style "fg=#d0a215,bg=#343331"
set -g message-style "fg=#cecdc3,bg=#343331"
set -g message-command-style "fg=#cecdc3,bg=#343331"

# --- Minimal theme status bar (stolen from binoymanoj/tmux-minimal-theme) ---
# Inlined + adapted for macOS (free->ps, /sys battery->pmset). Placed after tpm
# so it overrides plugin-provided status styling. Recolored to match terminal:
# bg=default (transparent, inherits terminal bg), flexoki text #cecdc3,
# accent blue #1688f0, muted #878580, faint sep #575653, border #403e3c.
set -g @accent "#1688f0"  # default; nvim overrides per colorscheme (Function hl)
set -g @accent_dim "#0d5190"  # darkened accent for pane borders; nvim overrides too

# Show a clock in the bar only when (likely) fullscreen. tmux can't query
# Ghostty's fullscreen state, so we detect it by client height: windowed is
# ~37 rows, fullscreen ~44 on this display. Bump/lower @fs-rows if your screen
# differs (run: tmux display -p '#{client_height}' in each state to calibrate).
set -g @fs-rows 41
# Two-row status: the real bar on row 0 (tmux's default status-format), plus a
# blank spacer row beneath it for breathing room before the panes.
set -g status 2
set -g status-format[1] ""
set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=default,fg=#cecdc3"
set -g status-left-length 100
set -g status-right-length 200

set -g pane-border-style "fg=#403e3c"
set -g pane-active-border-style "fg=#{@accent_dim}"

set -g window-status-separator ""
set -g window-status-format "#[fg=#878580,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#{@accent},bg=default,bold] #I:#W "

set -g status-left "#[fg=#{@accent},bold]  #S #[fg=#575653]│ "
set -g status-right "#[fg=#{@accent}] #[fg=#cecdc3]#([ #{pane_current_path} = $HOME ] && echo '~' || basename '#{pane_current_path}') #($HOME/.tmux/scripts/git-branch.sh '#{pane_current_path}')#[fg=#575653]│ #[fg=#{@accent}] #[fg=#cecdc3]#($HOME/.tmux/scripts/window-mem.sh '#{window_id}') #[fg=#575653]│ #[fg=#{@accent}] #[fg=#cecdc3]#(memory_pressure | awk -F'[ %]+' '/free percentage/ {print 100-$(NF-1)\"%\"}') #{?#{>=:#{client_height},#{@fs-rows}},#[fg=#575653]│ #[fg=#{@accent}]  #[fg=#cecdc3]%H:%M ,}"

set -g clock-mode-colour "#1688f0"
set -g clock-mode-style 24

# agent-deck configuration
# agent-deck-tmux-config-version: 3
# Added by agent-deck installer - 2026-04-01
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Extended keys: forward Shift+Enter and other modified keys to apps (tmux 3.2+)
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Mouse support (scroll + drag-to-copy)
set -g mouse on

# Auto-enter copy-mode when scrolling up (critical for WSL compatibility)
# This handles: 1) apps with mouse support, 2) already in copy-mode, 3) normal pane
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode (both vi and emacs modes)
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration (drag-to-copy)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# End agent-deck configuration

