set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Essential Neovim fixes
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'


# Better scrollback
set -g history-limit 50000

bind c new-window -c "#{pane_current_path}"

# Switch windows by index (Alt + number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Renumber windows when one is closed
set -g renumber-windows on

# Vi mode for copy mode
setw -g mode-keys vi

# Better splits (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Electric Nord theme for dotbar
set -g @tmux-dotbar-bg '#2E3440'
set -g @tmux-dotbar-fg '#4C566A'
set -g @tmux-dotbar-fg-current '#00D4FF'
set -g @tmux-dotbar-fg-session '#88C0FC'
set -g @tmux-dotbar-fg-prefix '#5EEAD4'

set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
