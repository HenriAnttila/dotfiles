# ═══════════════════════════════════════════════════════════════════════════
#  Hyprland Configuration - Electric Nord Theme
#  A vibrant Nordic aesthetic with electric blue accents
# ═══════════════════════════════════════════════════════════════════════════

################
### MONITORS ###
################

monitor = DP-3, 2560x1440@165, 0x0, 1
monitor = DP-1, preferred, 2560x0, 1, transform, 1

workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-3
workspace = 4, monitor:DP-3
workspace = 5, monitor:DP-1, default:true
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

## fuck splash
splash = false

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun -show-icons


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = dunst


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Nordic-cursors


#####################
### LOOK AND FEEL ###
#####################

# Electric Nord Colors
# ─── Polar Night (Backgrounds) ───
$polar0    = rgb(2E3440)
$polar1    = rgb(3B4252)
$polar2    = rgb(434C5E)
$polar3    = rgb(4C566A)

# ─── Snow Storm (Text) ───
$snow0     = rgb(D8DEE9)
$snow1     = rgb(E5E9F0)
$snow2     = rgb(ECEFF4)

# ─── Electric Frost (Primary Accents) ───
$electric1 = rgb(00D4FF)
$electric2 = rgb(00B4FF)
$electric3 = rgb(5EEAD4)
$frost     = rgb(88C0FC)

# ─── Aurora (Secondary Accents) ───
$aurora_teal   = rgb(8FBCBB)
$aurora_cyan   = rgb(88C0D0)
$aurora_blue   = rgb(81A1C1)
$aurora_purple = rgb(C792EA)
$aurora_red    = rgb(FF6B8A)
$aurora_orange = rgb(FFAB70)
$aurora_yellow = rgb(FFE066)
$aurora_green  = rgb(95E6A0)

general {
    gaps_in = 6
    gaps_out = 12

    border_size = 3

    col.active_border = $electric1 $electric3 45deg
    col.inactive_border = $polar2

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(00D4FF22)
        offset = 0 4
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        xray = false
        vibrancy = 0.3
        noise = 0.02
    }
}

animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.4, 0.8, 0.2, 1.2
    bezier = gentle, 0.5, 0, 0.5, 1
    bezier = electric, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, electric, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, gentle
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop
    animation = fade, 1, 4, smoothIn
    animation = fadeDim, 1, 4, smoothIn
    animation = workspaces, 1, 5, electric, slidevert
    animation = specialWorkspace, 1, 5, overshot, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
    vrr = 1
}


#############
### INPUT ###
#############

input {
    kb_layout = fi
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ─── Core (i3-style) ───
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, D, exec, $menu
bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod SHIFT, E, exit,

# ─── Layout ───
bind = $mainMod, H, layoutmsg, preselect l
bind = $mainMod, V, layoutmsg, preselect d
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod, space, cyclenext,
bind = $mainMod, space, alterzorder, top
bind = $mainMod, E, togglesplit,
bind = $mainMod, W, togglegroup,
bind = $mainMod, A, changegroupactive, b

# ─── Focus (i3-style: j=left, k=down, l=up, ;=right) ───
bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, L, movefocus, u
bind = $mainMod, semicolon, movefocus, r

# Focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# ─── Move windows (i3-style) ───
bind = $mainMod SHIFT, J, movewindow, l
bind = $mainMod SHIFT, K, movewindow, d
bind = $mainMod SHIFT, L, movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r

# Move with arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# ─── Workspaces ───
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Screenshot keybinds
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy

# ─── Scratchpad (like i3 stacking/tabbed replacement) ───
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ─── Resize mode (i3-style: $mod+r enters, Escape exits) ───
bind = $mainMod, R, submap, resize
submap = resize
binde = , J, resizeactive, -30 0
binde = , K, resizeactive, 0 30
binde = , L, resizeactive, 0 -30
binde = , semicolon, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , down, resizeactive, 0 30
binde = , up, resizeactive, 0 -30
binde = , right, resizeactive, 30 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# ─── Config management (i3-style) ───
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ─── Mouse bindings ───
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Media keys ───
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ─── Screenshot (i3-style) ───
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, sleep 3 && grim -g "$(slurp)" - | wl-copy


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-dialogs
    match:title = ^(Open|Save|File|Folder|Choose).*$
    float = yes
    center = yes
}
