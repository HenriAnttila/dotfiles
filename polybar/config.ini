[colors]
background = ${xrdb:color0}
background-alt = ${xrdb:color1}
foreground = ${xrdb:color7}
foreground-alt = ${xrdb:color7}
primary = ${xrdb:color3}
secondary = ${xrdb:color4}
alert = ${xrdb:color2}
icon-network = ${xrdb:color6}
icon-cpu = ${xrdb:color5}
icon-memory = ${xrdb:color4}
icon-brightness = ${xrdb:color3}
icon-volume = ${xrdb:color2}
icon-time = ${xrdb:color5}

[bar/top]
enable-ipc = true
width = 100%
height = 30
offset-x = 1%
offset-y = 10
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = #f00


padding-left = 2
padding-right = 1

module-margin-left = 1
module-margin-right = 1

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;3
font-2 = siji:pixelsize=10;1
font-3 = "Font Awesome 5 Free:style=Solid:pixelsize=10;1"
font-4 = "Font Awesome 5 Brands:pixelsize=10;1"

modules-left = weather
modules-center = music
modules-right = bluetooth time

override-redirect = false
wm-restack = i3

cursor-click = pointer
cursor-scroll = ns-resize

[module/arch-logo]
type = custom/text
format = <label>
label =
label-foreground = ${colors.primary}
label-font = 2

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true

strip-wsnumbers = true
show-urgent = true

label-mode-padding = 1
label-mode-foreground = #000
label-mode-background = ${colors.primary}

; Active workspace - filled circle with primary color
label-focused = ●
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

; Window exists but not active - filled circle
label-unfocused = ●
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

; Visible on another monitor
label-visible = ●
label-visible-foreground = ${colors.primary}
label-visible-padding = 1

; Urgent workspace
label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

; Empty workspace - empty circle
label-empty = ○
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1

[module/system-center]
type = custom/script
exec = ~/.config/polybar/scripts/backlight.sh
interval = 1
format = <label>
label = %output%
label-font = 1

[module/system]
type = custom/script
exec = ~/.config/polybar/scripts/system-center.sh
interval = 2
format = <label>
label = %output%
label-font = 1

[module/time]
type = custom/script
exec = LC_TIME=fi_FI.UTF-8 date '+%b %d  %H:%M'
interval = 5
format = <label>
label-font = 1
format-prefix = "  "
format-prefix-foreground = ${colors.icon-time}

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
format-padding = 2

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 600
format-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = ~/.config/polybar/scripts/bluetooth.sh --menu
format = <label>
format-padding = 2
label = %output%
cursor-click = pointer

[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5

; vim:ft=dosini
