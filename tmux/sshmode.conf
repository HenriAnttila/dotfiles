# Overrides for the sshmode key table.
#
# ssh-mode-table.sh copies the whole root table into sshmode first, so every
# no-prefix binding keeps working while SSH mode is on; this file then re-points
# the ones that open something at the ssh host. Sourced by that script, not by
# tmux.conf, so the copy can never land on top of these.
#
# The host comes from @ssh_mode_cmd, pinned when the mode was switched on, so
# these work from a local pane too.

# Alt+t leaves the mode (in the root table it enters it).
bind -T sshmode M-t run-shell "$HOME/.tmux/scripts/ssh-mode.sh off '#{pane_id}'"

# New window and splits, on the server.
bind -T sshmode M-c run-shell "$HOME/.tmux/scripts/ssh-open.sh -w '#{pane_id}'"
bind -T sshmode M-i run-shell "$HOME/.tmux/scripts/ssh-open.sh -h '#{pane_id}'"
bind -T sshmode M-- run-shell "$HOME/.tmux/scripts/ssh-open.sh -v '#{pane_id}'"

# Window slots: jump to it if it exists, otherwise create it on the server.
bind -T sshmode M-1 if-shell 'tmux select-window -t :1'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 1"'
bind -T sshmode M-2 if-shell 'tmux select-window -t :2'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 2"'
bind -T sshmode M-3 if-shell 'tmux select-window -t :3'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 3"'
bind -T sshmode M-4 if-shell 'tmux select-window -t :4'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 4"'
bind -T sshmode M-5 if-shell 'tmux select-window -t :5'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 5"'
bind -T sshmode M-6 if-shell 'tmux select-window -t :6'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 6"'
bind -T sshmode M-7 if-shell 'tmux select-window -t :7'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 7"'
bind -T sshmode M-8 if-shell 'tmux select-window -t :8'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 8"'
bind -T sshmode M-9 if-shell 'tmux select-window -t :9'  '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 9"'
bind -T sshmode M-0 if-shell 'tmux select-window -t :10' '' 'run-shell "$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id} 10"'

# Alt+n -> the same menu, running on the server. The title names the host so a
# menu that looks identical to the local one cannot be mistaken for it.
# npm still lands in the remote $HOME: tmux has no way to know the remote
# directory (that needs OSC 7 from the remote shell).
bind -T sshmode M-n display-menu -T "#[align=centre fg=#{@accent}]New window @ #{@ssh_mode_host}" -x C -y C \
  "lazygit"      g "run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} lazygit'" \
  "nvim"         e "run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} nvim'" \
  "claude"       c "run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} claude'" \
  "npm >"        n "display-menu -T '#[align=centre fg=#{@accent}]npm @ #{@ssh_mode_host}' -x C -y C \
                      'npm install'   i \"run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} npm install'\" \
                      'npm run dev'   d \"run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} npm run dev'\" \
                      'npm run build' b \"run-shell '$HOME/.tmux/scripts/ssh-run.sh -w #{pane_id} npm run build'\" \
                      '' \
                      'cancel'        q ''" \
  "" \
  "shell"        s "run-shell '$HOME/.tmux/scripts/ssh-open.sh -w #{pane_id}'" \
  "" \
  "cancel"       q ""

# Alt+o -> popup, on the server.
bind -T sshmode M-o display-menu -T "#[align=centre fg=#{@accent}]Popup @ #{@ssh_mode_host}" -x C -y C \
  "lazygit"      g "run-shell '$HOME/.tmux/scripts/ssh-run.sh -p #{pane_id} lazygit'" \
  "" \
  "cancel"       q ""

# Alt+p (PR picker) stays local on purpose: pr-checkout.sh lives on this machine
# and wants gh + fzf here. The copied root binding handles it.
