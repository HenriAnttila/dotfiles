# ═══════════════════════════════════════════════════════════════════════════
#  Alacritty Configuration - Electric Nord Theme
#  A vibrant Nordic aesthetic with electric blue accents
# ═══════════════════════════════════════════════════════════════════════════

# ─── Window Settings ─────────────────────────────────────────────────────────
[window]
opacity = 1.0
padding = { x = 14, y = 14 }
decorations = "Full"
option_as_alt = "OnlyLeft"  # macOS: left Option = Alt/Meta (tmux M- bindings); right Option still types special chars
#dynamic_padding = true
title = "Alacritty"
dynamic_title = true

[window.dimensions]
columns = 120
lines = 36


# ─── Scrolling ───────────────────────────────────────────────────────────────
[scrolling]
history = 10000
multiplier = 3


# ─── Font Settings ───────────────────────────────────────────────────────────
[font]
size = 16.5  # 16.5pt x 96/72 = 22px = native Terminess bitmap strike (crisp)

[font.normal]
family = "Monaspace Krypton NF"
style = "Regular"

[font.bold]
family = "Monaspace Krypton NF"
style = "Bold"

[font.italic]
family = "Monaspace Krypton NF"
style = "Italic"

[font.bold_italic]
family = "Monaspace Krypton NF"
style = "Bold Italic"

[font.offset]
x = 0
y = 2


# ─── EVILWARE Palette ────────────────────────────────────────────────────────
#  True-black OLED bg, electric cyan fg, hot-crimson accent. eDEX-UI homage.
[colors.primary]
background = "#000000"
foreground = "#00FAFF"
dim_foreground = "#0E5A5E"
bright_foreground = "#00FFE1"

[colors.cursor]
text = "#000000"
cursor = "#F10042"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#00FFE1"

[colors.search.matches]
foreground = "#000000"
background = "#00FAFF"

[colors.search.focused_match]
foreground = "#000000"
background = "#F10042"

[colors.footer_bar]
foreground = "#00FAFF"
background = "#072025"

[colors.hints.start]
foreground = "#000000"
background = "#F10042"

[colors.hints.end]
foreground = "#000000"
background = "#00FAFF"

[colors.selection]
text = "#FFFFFF"
background = "#072025"

# Normal colors - evilware two-tone (cyan + crimson)
[colors.normal]
black = "#000000"
red = "#F10042"
green = "#00FAFF"
yellow = "#F10042"
blue = "#00FAFF"
magenta = "#F10042"
cyan = "#00FAFF"
white = "#FF0059"

# Bright colors
[colors.bright]
black = "#1A1A1A"
red = "#F10042"
green = "#00FFE1"
yellow = "#F10042"
blue = "#00FFE1"
magenta = "#F10042"
cyan = "#00FFE1"
white = "#FFFFFF"

# Dim colors - muted variants
[colors.dim]
black = "#000000"
red = "#8A0026"
green = "#0E5A5E"
yellow = "#8A0026"
blue = "#0E5A5E"
magenta = "#8A0026"
cyan = "#0E5A5E"
white = "#072025"

# Indexed colors (for special highlights)
[[colors.indexed_colors]]
index = 16
color = "#F10042"

[[colors.indexed_colors]]
index = 17
color = "#00FAFF"


# ─── Cursor ──────────────────────────────────────────────────────────────────
[cursor]
blink_interval = 500
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "On"


# ─── Selection ───────────────────────────────────────────────────────────────
[selection]
save_to_clipboard = true


# ─── Mouse ───────────────────────────────────────────────────────────────────
[mouse]
hide_when_typing = true


# ─── Environment ─────────────────────────────────────────────────────────────
[env]
TERM = "xterm-256color"


# ─── Keyboard Bindings ───────────────────────────────────────────────────────
# Send NUL (0x00) on Ctrl+Space so tmux receives its C-Space prefix.
[[keyboard.bindings]]
key = "Space"
mods = "Control"
chars = "\u0000"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
