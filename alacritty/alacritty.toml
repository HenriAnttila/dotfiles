# ═══════════════════════════════════════════════════════════════════════════
#  Alacritty Configuration - Electric Nord Theme
#  A vibrant Nordic aesthetic with electric blue accents
# ═══════════════════════════════════════════════════════════════════════════

# ─── Window Settings ─────────────────────────────────────────────────────────
[window]
option_as_alt = "None"
#opacity = 0.92
#decorations = "None"
dynamic_padding = true
title = "Alacritty"
dynamic_title = true

[window.dimensions]
columns = 80
lines = 28


# ─── Scrolling ───────────────────────────────────────────────────────────────
[scrolling]
history = 10000
multiplier = 3


# ─── Font Settings ───────────────────────────────────────────────────────────
[font]
size = 16

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 10

# ─── Flexoki Dark Colors ────────────────────────────────────────────────────
[colors.primary]
background = "0x100F0F"
bright_foreground = "0xFFFCF0"
dim_foreground = "0xFFFCF0"
foreground = "0xFFFCF0"

[colors.cursor]
cursor = "0xFFFCF0"
text = "0xFFFCF0"

[colors.normal]
black = "0x100F0F"
red = "0xAF3029"
green = "0x66800B"
yellow = "0xAD8301"
blue = "0x205EA6"
magenta = "0xA02F6F"
cyan = "0x24837B"
white = "0xFFFCF0"

[colors.bright]
black = "0x100F0F"
red = "0xD14D41"
green = "0x879A39"
yellow = "0xD0A215"
blue = "0x4385BE"
magenta = "0xCE5D97"
cyan = "0x3AA99F"
white = "0xFFFCF0"

[colors.dim]
black = "0x100F0F"
red = "0xAF3029"
green = "0x66800B"
yellow = "0xAD8301"
blue = "0x205EA6"
magenta = "0xA02F6F"
cyan = "0x24837B"
white = "0xFFFCF0"


# ─── Cursor ──────────────────────────────────────────────────────────────────
[cursor]
blink_interval = 500
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "On"


# ─── Selection ───────────────────────────────────────────────────────────────
[selection]
save_to_clipboard = true


# ─── Mouse ───────────────────────────────────────────────────────────────────
[mouse]
hide_when_typing = true


# ─── Environment ─────────────────────────────────────────────────────────────
[env]
TERM = "xterm-256color"


# ─── Keyboard Bindings ───────────────────────────────────────────────────────
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
