# `ansi` follows the terminal palette (synced from nvim via OSC 4), so yazi
# matches whatever colorscheme nvim last set. Swap back to "flexoki-dark" for
# the static hardcoded look.
[flavor]
dark = "ansi"
light = "ansi"

# The `ansi` flavor's folder glyphs got stripped (Nerd Font private-use chars
# were lost when the flavor file was saved), so folders rendered with no icon.
# Re-add them here at the user level — a user theme.toml wins over the flavor.
[icon]
prepend_conds = [
  { if = "dir", text = "", fg = "blue" },
]

# Same glyph loss hit the flavor's named-folder icons (Desktop, Documents, ...):
# their `text` is empty, and a name match beats the `dir` condition above, so
# those folders showed no icon at all. Re-add them here too.
prepend_dirs = [
  { name = ".config",     text = "", fg = "blue" },
  { name = ".git",        text = "", fg = "blue" },
  { name = ".github",     text = "", fg = "blue" },
  { name = ".npm",        text = "", fg = "blue" },
  { name = "Desktop",     text = "", fg = "blue" },
  { name = "Development", text = "", fg = "blue" },
  { name = "Documents",   text = "", fg = "blue" },
  { name = "Downloads",   text = "", fg = "blue" },
  { name = "Library",     text = "", fg = "blue" },
  { name = "Movies",      text = "", fg = "blue" },
  { name = "Music",       text = "", fg = "blue" },
  { name = "Pictures",    text = "", fg = "blue" },
  { name = "Public",      text = "", fg = "blue" },
  { name = "Videos",      text = "", fg = "blue" }
]
